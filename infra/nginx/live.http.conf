# Nginx site for Livecast — bootstrap variant used until the TLS certificate
# exists. Serves the ACME challenge and lets the panel answer over plain HTTP
# on the loopback host, so the certificate can be issued without a chicken-and-egg
# problem. provision.sh replaces this file with live.conf afterwards.

server {
    listen 80;
    server_name __DOMAIN__;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location ~ "^/(live|backup)/whip$" {
        proxy_pass http://127.0.0.1:8889;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        client_max_body_size 1m;
    }

    location / {
        proxy_pass http://127.0.0.1:4100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
