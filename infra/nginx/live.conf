# Nginx site for Livecast — TLS variant.
# Installed by provision.sh only once the certificate exists. The HTTP/ACME-only
# variant (live.http.conf) covers the period before that.

server {
    listen 80;
    server_name __DOMAIN__;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name __DOMAIN__;

    ssl_certificate     /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:livecast:10m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    server_tokens off;

    # HLS on disk, three shapes of path:
    #   /hls/<slug>/master.m3u8          master playlist
    #   /hls/<slug>/<720|480|360>/index.m3u8  variant playlist
    #   /hls/<slug>/<720|480|360>/seg_*.ts    media segment
    # The variant directory is part of the URL — the first version of this file
    # matched only files directly under the slug, so every segment silently fell
    # through to the Fastify proxy (no immutable caching, Node doing the work).
    # Playlists must never be cached; segments are immutable.
    # Regexes are quoted: the `{10}` quantifier would otherwise be read as a
    # config block delimiter ("missing closing parenthesis").
    location ~ "^/hls/([a-z0-9]{10})/(master\.m3u8)$" {
        alias __APP_DIR__/data/hls/$1/$2;
        default_type application/vnd.apple.mpegurl;
        add_header Cache-Control "no-store";
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
        access_log off;
    }

    location ~ "^/hls/([a-z0-9]{10})/([0-9]+)/(index\.m3u8)$" {
        alias __APP_DIR__/data/hls/$1/$2/$3;
        default_type application/vnd.apple.mpegurl;
        add_header Cache-Control "no-store";
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
        access_log off;
    }

    # CORS on /hls/* matters when a CDN serves these from another hostname: the
    # player fetches them cross-origin. Public content, wildcard origin.
    location ~ "^/hls/([a-z0-9]{10})/([0-9]+)/([^/]+\.ts)$" {
        alias __APP_DIR__/data/hls/$1/$2/$3;
        default_type video/mp2t;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:4100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
}
