# Nginx site for NDX Live — TLS variant.
# Installed by provision.sh only once the certificate exists. The HTTP/ACME-only
# variant (live.http.conf) covers the period before that.

server {
    listen 80;
    server_name __DOMAIN__;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name __DOMAIN__;

    ssl_certificate     /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:ndxlive:10m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    server_tokens off;

    # Live manifests must never be cached by the browser...
    # Quoted on purpose: the `{10}` quantifier would otherwise be read by
    # nginx's config parser as a block delimiter ("missing closing parenthesis").
    location ~ "^/hls/([a-z0-9]{10})/([^/]+\.m3u8)$" {
        alias /srv/ndx-live/data/hls/$1/$2;
        default_type application/vnd.apple.mpegurl;
        add_header Cache-Control "no-store";
        # CORS: with a CDN configured the player fetches these from another
        # hostname. Public content, wildcard origin.
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
        access_log off;
    }

    # ...while segments are immutable: a CDN in front can cache them forever.
    location ~ "^/hls/([a-z0-9]{10})/([^/]+\.ts)$" {
        alias /srv/ndx-live/data/hls/$1/$2;
        default_type video/mp2t;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:4100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
}
