packages:
  - apps/*
# Native modules must compile: better-sqlite3 and esbuild ship prebuilt binaries
# for the common platforms, but pnpm blocks install scripts until the workspace
# opts in. Listed explicitly rather than using "*", so a compromised transitive
# dependency cannot quietly gain a postinstall hook.
# pnpm v12 reads `allowBuilds` (a mapping); v10/v11 read the list form below.
allowBuilds:
  better-sqlite3: true
  esbuild: true
onlyBuiltDependencies:
  - better-sqlite3
  - esbuild
